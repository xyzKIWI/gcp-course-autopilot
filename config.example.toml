# model = "<your model id>"
#
# [[answer.providers]]
# type = "xai"         # Grok API; key: XAI_API_KEY
# model = "<your model id>"
#
# [[answer.providers]]
# type = "cli"         # an agent CLI as last resort (it HAS tools: documented risk)
# name = "my-agent"
# command = ["<agent-cli>", "<non-interactive flag>", "{prompt}"]   # see your CLI's docs
# ({schema_file} is also available, e.g. for CLIs that accept a JSON schema file)

# Optional fallback agent for page changes. It may only use autopilot/browser_helper.py.
# [fallback]
# command = ["<agent-cli>", "<non-interactive flag>", "{prompt}"]
# success_json_field = "status"     # optional: a field in the CLI's JSON output that signals success
# success_value = "SUCCESS"
